# ============================================================
# rule-providers —— 远程模式（type: http，指向你自己的 GitHub 仓库）
# 把 __RAW_BASE__ 替换成 raw 地址前缀，例如
#   __RAW_BASE__ -> https://raw.githubusercontent.com/yourname/clash-rules/main
# 注意：仓库必须 public，Clash Verge 无法为 raw 请求附加鉴权头
# ============================================================
rule-providers:
  reject:
    type: http
    behavior: domain
    format: yaml
    url: "__RAW_BASE__/rules/reject.yaml"
    path: ./ruleset/reject.yaml
    interval: 86400
