# ============================================================
# rule-providers —— 本地文件模式（type: file）
# 把 __RULES_DIR__ 替换成本仓库的绝对路径，例如
#   __RULES_DIR__ -> /Users/you/Documents/clash-rules
# 优点：离线可用、改完立即生效、不受上游变动影响
# ============================================================
rule-providers:
  reject:
    type: file
    behavior: domain
    format: yaml
    path: __RULES_DIR__/rules/reject.yaml
  private:
    type: file
    behavior: domain
    format: yaml
    path: __RULES_DIR__/rules/private.yaml
